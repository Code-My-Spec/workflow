id: "works-are-server-records"
kind: "issue"
title: Works are server records
text: |-
  The loop side of slice 2 in the doc "Works, workflows and the queue". Slices 0 and 1 are already merged (PR #1, PR #2). Carve is building the server side of the same slice; follow the doc for the server contract (endpoints, message names, record fields) and do not invent one.

  Today a work begins its life in the loop. Wanted: the server creates the work record at hand-in, and the loop claims a work the server created instead of creating its own. Every report the loop sends about a work (at hand-in, at each step change, the terminal report) updates that server record. The loop holds nothing about a work that the server record does not also hold, so a loop restart loses nothing: on start the loop recovers its works from the server records it has claimed and carries on at the step each record shows.

  Checks: tests with the server stubbed (no real server, never the real ~/.workflow or .git/workflow). The credential is never logged or written to disk or into conversation files. Don't weaken existing tests; the full suite passes. Do not tag, publish, push, or run `just release`.
criteria:
  - "A work exists as a record on the stubbed server before the loop sees it, and the loop claims that record rather than creating its own."
  - "Each step change the loop reports updates the claimed record on the server."
  - "After a loop restart, every claimed work resumes at the step its server record shows, with nothing lost."
