id: "story-ids-are-required"
kind: "issue"
title: Stories, rules and scenarios have no ids
text: |-
  Fault: stories, their rules and their scenarios have no ids, so nothing (a test, a review, a report) can name the criterion it is about. This follows story-hand-in-pins-a-commit (same design, approved by the owner; build on it, it may still be landing, so merge main as you go). The owner's words: "we need IDs for all this stuff, especially the stories and the criterion... the ID and the text is all we need."

  The story format gains ids, and nothing else:

    id: k3f9a2qw            # the story's own id
    title: ...
    story: ...
    rules:
      - id: 7hd2k1pz        # each rule
        rule: ...
        scenarios:
          - id: x9m4c8tb    # each scenario
            happy: ...      # or fails:

  An id is 8 characters from `0-9a-z` minus `0 o 1 l i` (no look-alikes), that is from `23456789abcdefghjkmnpqrstuvwxyz`. It is random and never changed once written. The file name stays the story's human handle.

  Wanted, as the smallest change that does it, with no new options:
  1. A story hand-in, both kinds (by id with or without `at`, and one that carries its text), refuses a story whose story, any rule or any scenario lacks an `id`, or whose ids repeat within the story. The refusal names each missing place (the story, or the rule/scenario by its position and text) and each repeated id. A hand-in that carries its text gets the missing ids generated by the loop before it is recorded, so the manager's own path never fails this check. Existing ids in carried text are kept as given.
  2. The work carries the ids: the agents' briefs show each rule and each scenario with its id, so a coder can name the criterion a test covers. No enforcement yet; just make them available.
  3. Stories without ids that are only READ (status, listing, look) keep working as today. Only a hand-in requires ids.

  Confirm in the code first where a story is parsed, validated, recorded and turned into briefs (StoryFile, the manager's hand_in, parts.ex/agents.ex), and grep every caller of what you change.

  Check: tests in temporary git repos with a fake agent, never the real ~/.workflow or .git/workflow, each failing when its code is removed:
  - a hand-in of a story missing an id (story, rule and scenario cases) is refused, naming it;
  - a hand-in with a repeated id is refused, naming it;
  - a hand-in carrying text gets ids generated, 8 characters from the alphabet above, unique within the story, written into the recorded file;
  - an agent's brief shows each rule and scenario with its id;
  - a story file without ids is still read for status or listing.
  Don't weaken or delete any existing test; update test fixtures that hand in stories only by adding ids.

  Report in the decision note the exact refusal wording and the story fields as built, because the chat agent's skill is written against them.

  Do not tag, publish, push, or touch any tap.
criteria:
  - "A story hand-in (by id, with or without `at`) whose story, any rule or any scenario has no `id` is refused, and the answer names each one that lacks an id"
  - "A story hand-in whose ids repeat within the story is refused, and the answer names each repeated id"
  - "A story hand-in that carries its own text has an id generated for the story, each rule and each scenario before it is recorded: 8 random characters from 23456789abcdefghjkmnpqrstuvwxyz, with no repeats in the story"
  - "A work's agent briefs show each rule and each scenario with its id"
  - "A story without ids that is only read (status, listing) is read as today, with no refusal"
