id: "evidence-folder-upload"
kind: "issue"
title: A landing's ci run does not upload its evidence folder
text: |-
  The contract is a folder. The ci recipe is already given the run's analysis dir as its argument; a project that wants evidence writes `<dir>/evidence/<journey id>/` holding that journey's stage screenshots (.png). After ci exits 0, and only when config has a server, the loop looks in `<dir>/evidence`: for each sub-folder with at least one .png it sends the .png files plus `stories/<journey id>.yml` from the ci checkout when that file exists, through POST <server url>/api/loop/evidence (bearer = the loop's token; body {project_id, commit, journey, files}; answer {folder, puts: {name: url}}; PUT each file). No folder or no .png: nothing is sent and nothing is logged as a fault. Any failure logs one warning and never changes ci's result. Upload must finish before the ci checkout is pruned. Document the folder contract in the README beside the recipes. Tests against a fake HTTP function and a tmp dir.
criteria:
  - "After ci exits 0 and config has a server, for each sub-folder of <dir>/evidence holding at least one .png, the loop POSTs <server url>/api/loop/evidence with the loop's bearer token and {project_id, commit, journey, files}, then PUTs each file to its url from the answer's puts"
  - "The files sent for a journey are its .png files plus stories/<journey id>.yml from the ci checkout when that file exists, and the upload finishes before the ci checkout is pruned"
  - "With no evidence folder or no .png, nothing is sent and nothing is logged as a fault"
  - "Any failure of the POST or a PUT logs one warning and leaves ci's result unchanged"
  - "The README documents the evidence folder contract beside the recipes"
