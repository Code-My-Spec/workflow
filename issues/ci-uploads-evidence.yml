id: "ci-uploads-evidence"
kind: "issue"
title: A landing's ci run does not upload its journey evidence
text: |-
  Fault: when a landing's ci run passes, the evidence its journeys made (the journey yml and the stage screenshots) stays on this machine. The app's server never receives it.

  First check: does today's ci run make stage screenshots, where journey slides are written now? If it does not, STOP. Do not invent a second run. Say so plainly in the decision note, so the owner can decide.

  Wanted, if ci does make them, as the smallest change that does it:
  1. After a landing's ci run exits 0, and only when config has a server, the loop uploads each journey's evidence at the landed commit.
  2. Contract (the app side builds it now): POST <server url>/api/loop/evidence with the loop's bearer token (the same credential sign-in writes) and JSON {project_id, commit, journey, files: [names]}. The answer is {folder, puts: {name: presigned PUT url}}. The loop PUTs each file to its url.
  3. The files are the journey's yml and the stage screenshots that run made.
  4. An upload failure (POST or PUT, error or non-2xx) logs one warning and never changes ci's result. No token or presigned url is logged.
  5. With no server in config, or when ci exits non-zero, nothing is uploaded.

  Check: tests against a fake HTTP function only, with no network. They show: a passing ci with a server sends the POST with the right body and token, then one PUT per named file; no request when ci fails or when there is no server; a failing POST or PUT gives a warning and leaves ci's result as it was; and the captured log holds no token or url.

  Do not tag or publish anything.
criteria:
  - "After a landing's ci run exits 0 and config has a server, for each journey the loop POSTs <server url>/api/loop/evidence with the loop's bearer token and {project_id, commit (the landed commit), journey, files: [names]}, then PUTs each named file (the journey's yml and that run's stage screenshots) to its presigned url from the answer's puts"
  - "No evidence request is made when ci exits non-zero or when config has no server"
  - "When the evidence POST or any PUT fails, the loop logs a warning, and ci's result for the landing is unchanged"
  - "No bearer token or presigned url appears in any log line"
