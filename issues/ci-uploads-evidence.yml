id: "ci-uploads-evidence"
kind: "issue"
title: A landing's ci run does not upload its journey evidence
text: |-
  Fault: when a landing's ci run passes, the evidence its journeys made stays on this machine. The app's server never receives it.

  New direction from the owner (this replaces the earlier text): the loop makes no screenshots and should not. The contract is a folder. The ci recipe is already given the run's analysis dir as its argument. A project that wants evidence writes `<dir>/evidence/<journey id>/`, holding that journey's stage screenshots (.png).

  Wanted, as the smallest change that does it:
  1. After a landing's ci run exits 0, and only when config has a server, the loop looks in `<dir>/evidence`.
  2. For each sub-folder with at least one .png, it sends the .png files, plus `stories/<journey id>.yml` from the ci checkout when that file exists.
  3. Contract: POST <server url>/api/loop/evidence with bearer = the loop's token (the credential sign-in writes) and JSON body {project_id, commit (the landed commit), journey (the journey id), files: [names]}. The answer is {folder, puts: {name: presigned PUT url}}. PUT each file to its url.
  4. No evidence folder, or a sub-folder with no .png: nothing is sent and nothing is logged as a fault.
  5. Any failure (POST or PUT, error or non-2xx) logs one warning and never changes ci's result. No token or presigned url is logged.
  6. The upload must finish before the ci checkout is pruned.
  7. Document the folder contract in the README beside the recipes.

  Check: tests against a fake HTTP function and a tmp dir only, no network. They show: a passing ci with a server and an evidence folder sends the POST with the right body and token, then one PUT per named file (including the story yml when present, and leaving it out when absent); no request when ci fails, there is no server, no evidence folder, or no .png; a failing POST or PUT gives one warning and leaves ci's result as it was; the captured log holds no token or url; and the upload happens before the checkout is pruned.

  Do not tag or publish anything.
criteria:
  - "After a landing's ci run exits 0 and config has a server, for each sub-folder of <analysis dir>/evidence holding at least one .png, the loop POSTs <server url>/api/loop/evidence with the loop's bearer token and {project_id, commit (the landed commit), journey (the sub-folder name), files: [names]}, then PUTs each named file to its url from the answer's puts"
  - "The files sent for a journey are its .png files plus stories/<journey id>.yml from the ci checkout when that file exists, and the upload finishes before the ci checkout is pruned"
  - "No evidence request is made, and no fault is logged, when ci exits non-zero, config has no server, there is no evidence folder, or a journey folder has no .png"
  - "When the evidence POST or any PUT fails, the loop logs one warning with no token or url in it, and ci's result for the landing is unchanged"
