title: Standing up a server is a work like any other
workflow: Get work off the machine
story: >
  As an owner who bought the server, I want it stood up by a standard run of steps, with an agent stepping in only when one fails, so that provisioning is boring and debuggable.
rules:
  - rule: Provision is a third kind of work, beside story and issue, in the loop everyone gets. Nothing about Hetzner or any provider is in the loop. The manager hands one in with hand_in, and it is kept as provisions/<id>.yml in the main copy.
    scenarios:
      - happy: The manager hands in a provision work with hand_in; provisions/<id>.yml is in the main copy and the work starts.
  - rule: "The project names the steps: provision/steps lists step names, one per line, in order. The loop runs each as `just provision <step> <dir>` in the work's checkout and reads the SARIF it leaves in <dir>, exactly as it reads `just certify`. One of a project's steps installs the two git hooks on the box."
    scenarios:
      - happy: Every step passes; the work is done and no agent ran.
      - fails: A project with no provision/steps file; the work stops and says so.
  - rule: The loop keeps no credentials. It passes the environment the service was started in through to each step's recipe, and never writes it to the results file, a note or a log.
    scenarios:
      - happy: A step's recipe sees a variable from the service's environment, and its value appears in no results file, note or log.
  - rule: A failed step goes to a coder in the same checkout with the step's note (read, edit, write, bash); the coder changes the project's scripts and commits; the same step runs again.
    scenarios:
      - happy: A step fails, the coder changes something, the step passes on the next run, and the work carries on to the next step.
      - fails: A step fails three times with nothing changed; the work waits and the manager is told.
  - rule: A provision work ends like an issue, so scripts fixed on the way land in the main copy.
    scenarios:
      - happy: A work whose coder committed a fix goes through certify, review and promote, and the fixed scripts are in the main copy.
      - happy: A work with no commits of its own is simply done, with no certify, review or promote.
  - rule: A step that passed is not run again at the same tree. Whether the thing already exists in the world is the recipe's business, not the loop's.
    scenarios:
      - happy: A step that passed is not run again while the tree is unchanged.
