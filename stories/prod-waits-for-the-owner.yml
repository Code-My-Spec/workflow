title: Prod is provisioned only on the owner's word
story: >
  As an owner, I want prod to change only when I say so, so that nothing reaches my customers by itself.
rules:
  - rule: "A provision work whose target is prod does not run its steps when handed in. It is kept as waiting on its owner, saying what it would deploy: the tree, and the commits since the last prod provision that passed, if any."
    scenarios:
      - happy: A prod provision work is handed in; none of its steps runs, and look says it waits for the owner's go and names the tree and the commits since the last prod provision that passed.
      - happy: A prod provision work is handed in when no prod provision has passed before; look says it waits for the owner's go and names the tree.
  - rule: A waiting prod provision runs only when POST /work/go is called on the service's own address with the work's id. Neither the chat's say nor any of the manager's tools can start it.
    scenarios:
      - happy: POST /work/go with the work's id runs its steps.
      - fails: The manager's decide on the waiting prod provision, or a say from the chat, does not start its steps.
  - rule: A landing never deploys prod by itself.
    scenarios:
      - fails: "With \"deploy\": \"prod\" in config.json, the service refuses to start, with a reason saying a landing never deploys prod by itself."
